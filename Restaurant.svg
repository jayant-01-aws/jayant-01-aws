<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>

    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowEmerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399" />
    </marker>

    <!-- Keyframe Animations -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');

      text { font-family: 'Plus Jakarta Sans', sans-serif; }
      .code-font { font-family: 'Fira Code', monospace; }

      /* Flowing dashes on connectors */
      .dash-animated {
        stroke-dasharray: 8, 12;
        animation: dashMove 1.2s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -20; }
      }

      /* Synchronized Card Float Animation */
      .node-float {
        animation: nodeFloat 4s ease-in-out infinite alternate;
      }
      .node-float-rev {
        animation: nodeFloatRev 4s ease-in-out infinite alternate;
      }

      @keyframes nodeFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }

      @keyframes nodeFloatRev {
        0% { transform: translateY(-7px); }
        100% { transform: translateY(0px); }
      }

      /* Floating Decorative 3D Cube Rotation */
      .cube-spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: cubeRotate 8s linear infinite;
      }
      @keyframes cubeRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* GSAP Timeline Pulse Signal */
      .timeline-pulse {
        animation: linePulse 2s ease-in-out infinite alternate;
      }
      @keyframes linePulse {
        0% { opacity: 0.3; stroke-width: 2; }
        100% { opacity: 1; stroke-width: 4; }
      }

      /* Elastic Spring Physics Oscillation */
      .spring-wave {
        animation: springOscillate 1.8s ease-in-out infinite alternate;
      }
      @keyframes springOscillate {
        0% { transform: scaleX(0.92); }
        100% { transform: scaleX(1.08); }
      }

      /* WebGL Canvas Pulse Orb */
      .canvas-orb {
        animation: orbGlow 2.5s ease-in-out infinite alternate;
      }
      @keyframes orbGlow {
        0% { r: 16px; opacity: 0.4; }
        100% { r: 22px; opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Outer Browser Canvas Container -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="20" stroke="#1E293B" stroke-width="2" filter="url(#softShadow)" />

  <!-- Background Tech Grid -->
  <g opacity="0.08">
    <path d="M 0 80 H 960 M 0 160 H 960 M 0 240 H 960 M 0 320 H 960 M 0 400 H 960 M 0 480 H 960 M 0 560 H 960" stroke="#F8FAFC" stroke-width="1"/>
    <path d="M 80 0 V 640 M 160 0 V 640 M 240 0 V 640 M 320 0 V 640 M 400 0 V 640 M 480 0 V 640 M 560 0 V 640 M 640 0 V 640 M 720 0 V 640 M 800 0 V 640 M 880 0 V 640" stroke="#F8FAFC" stroke-width="1"/>
  </g>

  <!-- Browser Header Window Bar -->
  <path d="M 0 0 H 960 V 65 H 0 Z" fill="#090D16" rx="20" />
  <rect x="0" y="45" width="960" height="20" fill="#090D16" />
  <line x1="0" y1="65" x2="960" y2="65" stroke="#1E293B" stroke-width="1.5" />

  <!-- Window Control Buttons -->
  <circle cx="40" cy="33" r="6.5" fill="#EF4444" />
  <circle cx="62" cy="33" r="6.5" fill="#F59E0B" />
  <circle cx="84" cy="33" r="6.5" fill="#10B981" />

  <!-- Browser Address / Title Bar -->
  <rect x="120" y="21" width="340" height="26" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="135" y="38" font-size="13" class="code-font" fill="#94A3B8">⚡ 3D Architecture Workflow</text>


  <!-- ==================== ANIMATED CONNECTING PATHS ==================== -->

  <!-- Path 1: R3F Canvas -> Custom 3D Models (Top Horizontal) -->
  <path id="flow1" d="M 400 190 H 535" stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 400 190 H 535" stroke="#38BDF8" stroke-width="3" fill="none" class="dash-animated" marker-end="url(#arrowCyan)"/>

  <!-- Path 2: R3F Canvas -> GSAP Scroll Triggers (Vertical Down) -->
  <path id="flow2" d="M 245 270 V 395" stroke="#34D399" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 245 270 V 395" stroke="#34D399" stroke-width="3" fill="none" class="dash-animated" marker-end="url(#arrowEmerald)"/>

  <!-- Path 3: GSAP Scroll Triggers -> Elastic Cursor (Bottom Horizontal) -->
  <path id="flow3" d="M 400 460 H 535" stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 400 460 H 535" stroke="#38BDF8" stroke-width="3" fill="none" class="dash-animated" marker-end="url(#arrowCyan)"/>


  <!-- CONTINUOUS TRAVELING DATA PACKETS (NEON ORBS) -->
  <circle r="5.5" fill="#38BDF8" filter="url(#glowCyan)">
    <animateMotion dur="1.2s" repeatCount="indefinite">
      <mpath href="#flow1"/>
    </animateMotion>
  </circle>

  <circle r="5.5" fill="#34D399" filter="url(#glowEmerald)">
    <animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite">
      <mpath href="#flow2"/>
    </animateMotion>
  </circle>

  <circle r="5.5" fill="#38BDF8" filter="url(#glowCyan)">
    <animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite">
      <mpath href="#flow3"/>
    </animateMotion>
  </circle>


  <!-- ==================== WORKFLOW NODES / CARDS ==================== -->

  <!-- NODE 1: R3F Canvas (WebGL) -->
  <g class="node-float">
    <g transform="translate(90, 120)">
      <!-- Outer Neon Blur -->
      <rect width="310" height="140" rx="16" fill="none" stroke="url(#cyanNeon)" stroke-width="2" filter="url(#glowCyan)" opacity="0.4"/>
      <!-- Main Card Body -->
      <rect width="310" height="140" rx="16" fill="url(#cardGrad)" stroke="url(#cyanNeon)" stroke-width="2"/>
      
      <!-- Graphic/Icon: WebGL Animated Canvas Orb -->
      <g transform="translate(45, 60)">
        <circle cx="0" cy="0" r="24" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="18" fill="#38BDF8" class="canvas-orb" filter="url(#glowCyan)"/>
        <text x="0" y="6" font-size="16" text-anchor="middle">🎨</text>
      </g>

      <!-- Text Header & Subtitle -->
      <text x="95" y="58" font-size="18" font-weight="800" fill="#F8FAFC">R3F Canvas</text>
      <text x="95" y="85" font-size="13" class="code-font" fill="#38BDF8">(WebGL Engine)</text>
      
      <!-- Card Bottom Decorative Accent Bar -->
      <rect x="0" y="132" width="310" height="8" rx="0 0 16 16" fill="url(#cyanNeon)" />
    </g>
  </g>

  <!-- NODE 2: Custom 3D Models (Spline Exports) -->
  <g class="node-float-rev">
    <g transform="translate(550, 120)">
      <rect width="320" height="140" rx="16" fill="none" stroke="url(#purpleNeon)" stroke-width="2" filter="url(#glowPurple)" opacity="0.4"/>
      <rect width="320" height="140" rx="16" fill="url(#cardGrad)" stroke="url(#purpleNeon)" stroke-width="2"/>

      <!-- Graphic/Icon: Rotating 3D Wireframe Cube Icon -->
      <g transform="translate(45, 60)">
        <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#C084FC" fill-opacity="0.15" stroke="#E879F9" stroke-width="1.5" class="cube-spin"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">📦</text>
      </g>

      <text x="95" y="58" font-size="18" font-weight="800" fill="#F8FAFC">Custom 3D Models</text>
      <text x="95" y="85" font-size="13" class="code-font" fill="#C084FC">(Spline Exports)</text>

      <rect x="0" y="132" width="320" height="8" rx="0 0 16 16" fill="url(#purpleNeon)" />
    </g>
  </g>

  <!-- NODE 3: GSAP Scroll Triggers -->
  <g class="node-float-rev">
    <g transform="translate(90, 390)">
      <rect width="310" height="140" rx="16" fill="none" stroke="url(#emeraldNeon)" stroke-width="2" filter="url(#glowEmerald)" opacity="0.4"/>
      <rect width="310" height="140" rx="16" fill="url(#cardGrad)" stroke="url(#emeraldNeon)" stroke-width="2"/>

      <!-- Graphic/Icon: Animated Scroll Timeline Signal -->
      <g transform="translate(45, 60)">
        <circle cx="0" cy="0" r="22" fill="#10B981" fill-opacity="0.15"/>
        <path d="M -12 0 H 12" stroke="#34D399" class="timeline-pulse" stroke-linecap="round"/>
        <text x="0" y="6" font-size="16" text-anchor="middle">⚡</text>
      </g>

      <text x="95" y="58" font-size="18" font-weight="800" fill="#F8FAFC">GSAP Scroll</text>
      <text x="95" y="85" font-size="13" class="code-font" fill="#34D399">Triggers &amp; Timeline</text>

      <rect x="0" y="132" width="310" height="8" rx="0 0 16 16" fill="url(#emeraldNeon)" />
    </g>
  </g>

  <!-- NODE 4: Elastic Cursor & Physics Engine -->
  <g class="node-float">
    <g transform="translate(550, 390)">
      <rect width="320" height="140" rx="16" fill="none" stroke="url(#amberNeon)" stroke-width="2" filter="url(#glowAmber)" opacity="0.4"/>
      <rect width="320" height="140" rx="16" fill="url(#cardGrad)" stroke="url(#amberNeon)" stroke-width="2"/>

      <!-- Graphic/Icon: Animated Oscillating Spring / Physics -->
      <g transform="translate(45, 60)">
        <circle cx="0" cy="0" r="22" fill="#F59E0B" fill-opacity="0.15"/>
        <g class="spring-wave" transform-box="fill-box" transform-origin="center">
          <path d="M -12 -6 Q -6 6 0 -6 T 12 -6" fill="none" stroke="#FBBF24" stroke-width="2"/>
        </g>
        <text x="0" y="14" font-size="14" text-anchor="middle">🎯</text>
      </g>

      <text x="95" y="58" font-size="18" font-weight="800" fill="#F8FAFC">Elastic Cursor</text>
      <text x="95" y="85" font-size="13" class="code-font" fill="#FBBF24">Physics Engine</text>

      <rect x="0" y="132" width="320" height="8" rx="0 0 16 16" fill="url(#amberNeon)" />
    </g>
  </g>

</svg>
