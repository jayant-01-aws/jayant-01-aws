<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Neon Light Filters -->
    <filter id="neonCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap');

      text { font-family: 'Plus Jakarta Sans', sans-serif; }
      .code-font { font-family: 'Fira Code', monospace; }

      /* Animated Dash Connection Lines */
      .dash-flow {
        stroke-dasharray: 8, 12;
        animation: dashMove 1s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -20; }
      }

      /* Pulsing Radar Ring */
      .pulse-ring {
        animation: pulse 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        transform-origin: center;
      }
      @keyframes pulse {
        0% { r: 6px; opacity: 1; }
        100% { r: 18px; opacity: 0; }
      }

      /* Database Floating Ring Animation */
      .db-ring {
        animation: floatDb 2.5s ease-in-out infinite alternate;
      }
      @keyframes floatDb {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }

      /* Glowing Badge Animation */
      .live-badge {
        animation: badgeGlow 1.5s ease-in-out infinite alternate;
      }
      @keyframes badgeGlow {
        from { opacity: 0.6; }
        to { opacity: 1; filter: drop-shadow(0 0 6px #F43F5E); }
      }
    </style>
  </defs>

  <!-- Canvas Outer Boundary -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="20"/>

  <!-- Tech Grid Background -->
  <g opacity="0.08">
    <path d="M 0 70 H 960 M 0 140 H 960 M 0 210 H 960 M 0 280 H 960 M 0 350 H 960 M 0 420 H 960 M 0 490 H 960" stroke="#F8FAFC" stroke-width="1"/>
    <path d="M 80 0 V 560 M 160 0 V 560 M 240 0 V 560 M 320 0 V 560 M 400 0 V 560 M 480 0 V 560 M 560 0 V 560 M 640 0 V 560 M 720 0 V 560 M 800 0 V 560 M 880 0 V 560" stroke="#F8FAFC" stroke-width="1"/>
  </g>

  <!-- ==================== ANIMATED PATHS & SIGNALS ==================== -->
  
  <!-- Path 1: Customer -> Booking Form -->
  <path id="path1" d="M 190 140 H 280" stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M 190 140 H 280" stroke="#38BDF8" stroke-width="3" fill="none" class="dash-flow"/>
  
  <!-- Path 2: Booking Form -> PHP Controller -->
  <path id="path2" d="M 440 140 H 510" stroke="#C084FC" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M 440 140 H 510" stroke="#C084FC" stroke-width="3" fill="none" class="dash-flow"/>

  <!-- Path 3: PHP Controller -> MySQL -->
  <path id="path3" d="M 670 140 H 760" stroke="#34D399" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M 670 140 H 760" stroke="#34D399" stroke-width="3" fill="none" class="dash-flow"/>

  <!-- Path 4: PHP Controller -> Admin Panel (Elbow Connection) -->
  <path id="path4" d="M 590 200 V 320 H 380" stroke="#FBBF24" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M 590 200 V 320 H 380" stroke="#FBBF24" stroke-width="3" fill="none" class="dash-flow"/>

  <!-- DYNAMIC TRAVELING PARTICLES (DATA PACKETS) -->
  <circle r="5" fill="#38BDF8" filter="url(#neonCyan)">
    <animateMotion dur="1.2s" repeatCount="indefinite">
      <mpath href="#path1"/>
    </animateMotion>
  </circle>

  <circle r="5" fill="#E879F9" filter="url(#neonPurple)">
    <animateMotion dur="1.2s" begin="0.3s" repeatCount="indefinite">
      <mpath href="#path2"/>
    </animateMotion>
  </circle>

  <circle r="5" fill="#34D399" filter="url(#neonCyan)">
    <animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite">
      <mpath href="#path3"/>
    </animateMotion>
  </circle>

  <circle r="5" fill="#FBBF24" filter="url(#neonAmber)">
    <animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite">
      <mpath href="#path4"/>
    </animateMotion>
  </circle>


  <!-- ==================== DIAGRAM NODES ==================== -->

  <!-- NODE 1: Customer -->
  <g class="card" transform="translate(40, 80)">
    <rect width="150" height="120" rx="16" fill="url(#nodeBg)" stroke="url(#cyanGlow)" stroke-width="2" />
    <circle cx="75" cy="45" r="20" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="75" y="52" font-size="22" text-anchor="middle">🧑‍💻</text>
    <text x="75" y="88" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">Customer</text>
  </g>

  <!-- NODE 2: Booking Form -->
  <g class="card" transform="translate(280, 80)">
    <rect width="160" height="120" rx="16" fill="url(#nodeBg)" stroke="#334155" stroke-width="2"/>
    <rect x="15" y="15" width="130" height="90" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="80" y="52" font-size="20" text-anchor="middle">📋</text>
    <text x="80" y="82" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">Booking Form</text>
    <text x="80" y="98" font-size="11" class="code-font" fill="#64748B" text-anchor="middle">&lt;Frontend/&gt;</text>
  </g>

  <!-- NODE 3: PHP Controller -->
  <g class="card" transform="translate(510, 80)">
    <rect width="160" height="120" rx="16" fill="none" stroke="url(#purpleGlow)" stroke-width="3" filter="url(#neonPurple)" opacity="0.4"/>
    <rect width="160" height="120" rx="16" fill="url(#nodeBg)" stroke="url(#purpleGlow)" stroke-width="2"/>
    <text x="80" y="50" font-size="22" text-anchor="middle">⚡</text>
    <text x="80" y="78" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">PHP Controller</text>
    <text x="80" y="96" font-size="12" class="code-font" fill="#C084FC" text-anchor="middle">process.php</text>
  </g>

  <!-- NODE 4: MySQL Database -->
  <g class="card" transform="translate(760, 75)">
    <rect width="150" height="130" rx="16" fill="url(#nodeBg)" stroke="url(#emeraldGlow)" stroke-width="2"/>
    <g transform="translate(45, 20)">
      <ellipse cx="30" cy="12" rx="28" ry="10" fill="#059669" opacity="0.8"/>
      <path d="M 2 12 V 42 A 28 10 0 0 0 58 42 V 12" fill="none" stroke="#34D399" stroke-width="2"/>
      <path d="M 2 27 A 28 10 0 0 0 58 27" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3"/>
      <ellipse cx="30" cy="12" rx="28" ry="10" fill="none" stroke="#A7F3D0" stroke-width="2" class="db-ring"/>
    </g>
    <text x="75" y="90" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">MySQL</text>
    <text x="75" y="108" font-size="12" class="code-font" fill="#34D399" text-anchor="middle">(reservations)</text>
  </g>

  <!-- NODE 5: Admin Panel (Expanded Bottom Section) -->
  <g class="card" transform="translate(100, 260)">
    <rect width="570" height="220" rx="20" fill="none" stroke="url(#amberGlow)" stroke-width="2" filter="url(#neonAmber)" opacity="0.3"/>
    <rect width="570" height="220" rx="20" fill="url(#nodeBg)" stroke="url(#amberGlow)" stroke-width="2"/>

    <text x="35" y="50" font-size="18" font-weight="800" fill="#F8FAFC">🖥️ Admin Panel</text>
    
    <g transform="translate(185, 43)">
      <circle cx="0" cy="0" r="6" fill="#F43F5E" class="pulse-ring"/>
      <circle cx="0" cy="0" r="5" fill="#F43F5E"/>
      <rect x="12" y="-10" width="48" height="20" rx="10" fill="#F43F5E" fill-opacity="0.2" class="live-badge"/>
      <!-- <text x="36" y="4" font-size="11" font-weight="800" fill="#FB7185" text-anchor="middle">LIVE</text> -->
    </g>

    <line x1="35" y1="75" x2="535" y2="75" stroke="#334155" stroke-width="1.5"/>

    <!-- Action 1: Approvals -->
    <g transform="translate(35, 95)">
      <rect width="150" height="90" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
      <circle cx="30" cy="30" r="14" fill="#10B981" fill-opacity="0.2"/>
      <text x="30" y="35" font-size="14" text-anchor="middle">✅</text>
      <text x="55" y="35" font-size="14" font-weight="700" fill="#F8FAFC">Approvals</text>
      <text x="15" y="68" font-size="11" class="code-font" fill="#64748B">Auto/Manual</text>
    </g>

    <!-- Action 2: Cancellations -->
    <g transform="translate(210, 95)">
      <rect width="150" height="90" rx="12" fill="#1E293B" stroke="#F43F5E" stroke-width="1"/>
      <circle cx="30" cy="30" r="14" fill="#F43F5E" fill-opacity="0.2"/>
      <text x="30" y="35" font-size="14" text-anchor="middle">❌</text>
      <text x="55" y="35" font-size="14" font-weight="700" fill="#F8FAFC">Cancellations</text>
      <text x="15" y="68" font-size="11" class="code-font" fill="#64748B">Refunding...</text>
    </g>

    <!-- Action 3: Availability -->
    <g transform="translate(385, 95)">
      <rect width="150" height="90" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <circle cx="30" cy="30" r="14" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="30" y="35" font-size="14" text-anchor="middle">📅</text>
      <text x="55" y="35" font-size="14" font-weight="700" fill="#F8FAFC">Availability</text>
      <text x="15" y="68" font-size="11" class="code-font" fill="#64748B">Real-time Sync</text>
    </g>
  </g>

</svg>
