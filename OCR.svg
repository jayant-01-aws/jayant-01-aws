<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>

    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowEmerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24" />
    </marker>

    <!-- Keyframe Animations -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');

      text { font-family: 'Plus Jakarta Sans', sans-serif; }
      .code-font { font-family: 'Fira Code', monospace; }

      /* Flowing dashes on connectors */
      .dash-animated {
        stroke-dasharray: 8, 12;
        animation: dashMove 1.2s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -20; }
      }

      /* Synchronized Card Float Animation */
      .node-float {
        animation: nodeFloat 4s ease-in-out infinite alternate;
      }
      .node-float-rev {
        animation: nodeFloatRev 4s ease-in-out infinite alternate;
      }

      @keyframes nodeFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }

      @keyframes nodeFloatRev {
        0% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }

      /* Pulse Indicator */
      .pulse-dot {
        animation: pulseGlow 1.8s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.4; }
        100% { opacity: 1; filter: drop-shadow(0 0 8px #F43F5E); }
      }

      /* Scanning Line Animation for Vision Pipeline */
      .scan-line {
        animation: scanMove 2s ease-in-out infinite alternate;
      }
      @keyframes scanMove {
        0% { transform: translateY(-10px); }
        100% { transform: translateY(10px); }
      }
    </style>
  </defs>

  <!-- Outer Canvas Container -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="20" stroke="#1E293B" stroke-width="2" filter="url(#softShadow)" />

  <!-- Background Tech Grid -->
  <g opacity="0.08">
    <path d="M 0 80 H 960 M 0 160 H 960 M 0 240 H 960 M 0 320 H 960 M 0 400 H 960 M 0 480 H 960 M 0 560 H 960 M 0 640 H 960 M 0 720 H 960" stroke="#F8FAFC" stroke-width="1"/>
    <path d="M 80 0 V 780 M 160 0 V 780 M 240 0 V 780 M 320 0 V 780 M 400 0 V 780 M 480 0 V 780 M 560 0 V 780 M 640 0 V 780 M 720 0 V 780 M 800 0 V 780 M 880 0 V 780" stroke="#F8FAFC" stroke-width="1"/>
  </g>

  <!-- Top Window Header Bar -->
  <path d="M 0 0 H 960 V 65 H 0 Z" fill="#090D16" rx="20" />
  <rect x="0" y="45" width="960" height="20" fill="#090D16" />
  <line x1="0" y1="65" x2="960" y2="65" stroke="#1E293B" stroke-width="1.5" />

  <!-- Window Controls -->
  <circle cx="40" cy="33" r="6.5" fill="#EF4444" />
  <circle cx="62" cy="33" r="6.5" fill="#F59E0B" />
  <circle cx="84" cy="33" r="6.5" fill="#10B981" />

  <!-- Title Bar -->
  <rect x="120" y="21" width="380" height="26" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="135" y="38" font-size="13" class="code-font" fill="#94A3B8">📄 OCR &amp; Document Intelligence Pipeline</text>


  <!-- ==================== CONNECTOR PATHS & DATA PACKETS ==================== -->

  <!-- Path 1: Handwritten Doc -> Vision Pipeline -->
  <path id="flow1" d="M 230 155 V 195" stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 230 155 V 195" stroke="#38BDF8" stroke-width="3" fill="none" class="dash-animated" marker-end="url(#arrowCyan)"/>

  <!-- Path 2: Vision Pipeline -> Hybrid AI Engine -->
  <path id="flow2" d="M 380 265 H 520" stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 380 265 H 520" stroke="#38BDF8" stroke-width="3" fill="none" class="dash-animated" marker-end="url(#arrowCyan)"/>

  <!-- Path 3: Hybrid AI Engine -> Heuristic Ranking -->
  <path id="flow3" d="M 680 335 V 375" stroke="#C084FC" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 680 335 V 375" stroke="#C084FC" stroke-width="3" fill="none" class="dash-animated" marker-end="url(#arrowPurple)"/>

  <!-- Path 4: Heuristic Ranking -> Semantic Layout Analysis -->
  <path id="flow4" d="M 680 495 V 535" stroke="#34D399" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 680 495 V 535" stroke="#34D399" stroke-width="3" fill="none" class="dash-animated" marker-end="url(#arrowEmerald)"/>

  <!-- Path 5: Semantic Layout -> Django Middleware -->
  <path id="flow5" d="M 680 675 V 705" stroke="#FBBF24" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 680 675 V 705" stroke="#FBBF24" stroke-width="3" fill="none" class="dash-animated" marker-end="url(#arrowAmber)"/>


  <!-- CONTINUOUS TRAVELING DATA PACKETS -->
  <circle r="5.5" fill="#38BDF8" filter="url(#glowCyan)">
    <animateMotion dur="0.8s" repeatCount="indefinite">
      <mpath href="#flow1"/>
    </animateMotion>
  </circle>

  <circle r="5.5" fill="#38BDF8" filter="url(#glowCyan)">
    <animateMotion dur="1.2s" begin="0.2s" repeatCount="indefinite">
      <mpath href="#flow2"/>
    </animateMotion>
  </circle>

  <circle r="5.5" fill="#C084FC" filter="url(#glowPurple)">
    <animateMotion dur="1.0s" begin="0.4s" repeatCount="indefinite">
      <mpath href="#flow3"/>
    </animateMotion>
  </circle>

  <circle r="5.5" fill="#34D399" filter="url(#glowEmerald)">
    <animateMotion dur="1.0s" begin="0.6s" repeatCount="indefinite">
      <mpath href="#flow4"/>
    </animateMotion>
  </circle>

  <circle r="5.5" fill="#FBBF24" filter="url(#glowAmber)">
    <animateMotion dur="0.8s" begin="0.8s" repeatCount="indefinite">
      <mpath href="#flow5"/>
    </animateMotion>
  </circle>


  <!-- ==================== WORKFLOW NODES ==================== -->

  <!-- START NODE: Handwritten Doc -->
  <g class="node-float">
    <g transform="translate(100, 95)">
      <rect width="260" height="60" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="130" y="36" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">✍️ Handwritten Doc</text>
    </g>
  </g>

  <!-- NODE 1: Vision Pipeline -->
  <g class="node-float">
    <g transform="translate(80, 195)">
      <rect width="300" height="140" rx="16" fill="none" stroke="url(#cyanNeon)" stroke-width="2" filter="url(#glowCyan)" opacity="0.4"/>
      <rect width="300" height="140" rx="16" fill="url(#cardGrad)" stroke="url(#cyanNeon)" stroke-width="2"/>

      <!-- Vision Scanner Graphic -->
      <g transform="translate(45, 60)">
        <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5"/>
        <line x1="-15" y1="0" x2="15" y2="0" stroke="#38BDF8" stroke-width="2" class="scan-line"/>
        <text x="0" y="6" font-size="16" text-anchor="middle">👁️</text>
      </g>

      <text x="95" y="52" font-size="17" font-weight="800" fill="#F8FAFC">Vision Pipeline</text>
      <text x="95" y="76" font-size="12" class="code-font" fill="#38BDF8">Adaptive CLAHE +</text>
      <text x="95" y="94" font-size="12" class="code-font" fill="#38BDF8">Bilateral Filtering</text>

      <rect x="0" y="132" width="300" height="8" rx="0 0 16 16" fill="url(#cyanNeon)" />
    </g>
  </g>

  <!-- NODE 2: Hybrid AI Engine -->
  <g class="node-float-rev">
    <g transform="translate(520, 195)">
      <rect width="320" height="140" rx="16" fill="none" stroke="url(#purpleNeon)" stroke-width="2" filter="url(#glowPurple)" opacity="0.4"/>
      <rect width="320" height="140" rx="16" fill="url(#cardGrad)" stroke="url(#purpleNeon)" stroke-width="2"/>

      <g transform="translate(45, 60)">
        <circle cx="0" cy="0" r="22" fill="#C084FC" fill-opacity="0.15" stroke="#E879F9" stroke-width="1.5"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">🧠</text>
      </g>

      <text x="95" y="52" font-size="17" font-weight="800" fill="#F8FAFC">Hybrid AI Engine</text>
      <text x="95" y="76" font-size="12" class="code-font" fill="#C084FC">Gemini 1.5 Flash +</text>
      <text x="95" y="94" font-size="12" class="code-font" fill="#C084FC">Tesseract OCR</text>

      <rect x="0" y="132" width="320" height="8" rx="0 0 16 16" fill="url(#purpleNeon)" />
    </g>
  </g>

  <!-- NODE 3: Heuristic Ranking Algorithm -->
  <g class="node-float">
    <g transform="translate(520, 375)">
      <rect width="320" height="120" rx="16" fill="none" stroke="url(#purpleNeon)" stroke-width="2" filter="url(#glowPurple)" opacity="0.3"/>
      <rect width="320" height="120" rx="16" fill="url(#cardGrad)" stroke="url(#purpleNeon)" stroke-width="2"/>

      <g transform="translate(45, 52)">
        <circle cx="0" cy="0" r="20" fill="#C084FC" fill-opacity="0.15"/>
        <text x="0" y="6" font-size="16" text-anchor="middle">⚖️</text>
      </g>

      <text x="90" y="46" font-size="16" font-weight="800" fill="#F8FAFC">Heuristic Ranking</text>
      <text x="90" y="72" font-size="11" class="code-font" fill="#94A3B8">(best PSM / lexical density)</text>

      <rect x="0" y="112" width="320" height="8" rx="0 0 16 16" fill="url(#purpleNeon)" />
    </g>
  </g>

  <!-- NODE 4: Semantic Layout Analysis -->
  <g class="node-float-rev">
    <g transform="translate(520, 535)">
      <rect width="320" height="140" rx="16" fill="none" stroke="url(#emeraldNeon)" stroke-width="2" filter="url(#glowEmerald)" opacity="0.4"/>
      <rect width="320" height="140" rx="16" fill="url(#cardGrad)" stroke="url(#emeraldNeon)" stroke-width="2"/>

      <g transform="translate(45, 60)">
        <circle cx="0" cy="0" r="22" fill="#10B981" fill-opacity="0.15"/>
        <text x="0" y="6" font-size="18" text-anchor="middle">📐</text>
      </g>

      <text x="95" y="48" font-size="17" font-weight="800" fill="#F8FAFC">Semantic Layout</text>
      <text x="95" y="70" font-size="11" class="code-font" fill="#34D399">(LLM prompt engineering)</text>
      <text x="95" y="92" font-size="12" class="code-font" fill="#94A3B8">headers · tables · body</text>

      <rect x="0" y="132" width="320" height="8" rx="0 0 16 16" fill="url(#emeraldNeon)" />
    </g>
  </g>

  <!-- BOTTOM NODE: Django Middleware Logging -->
  <g class="node-float">
    <g transform="translate(470, 705)">
      <rect width="420" height="60" rx="14" fill="none" stroke="url(#amberNeon)" stroke-width="2" filter="url(#glowAmber)" opacity="0.4"/>
      <rect width="420" height="60" rx="14" fill="url(#cardGrad)" stroke="url(#amberNeon)" stroke-width="2" />
      
      <circle cx="30" cy="30" r="6" fill="#F43F5E" class="pulse-dot"/>
      <text x="50" y="28" font-size="14" font-weight="700" fill="#F8FAFC">Django Middleware Logging</text>
      <text x="50" y="46" font-size="11" class="code-font" fill="#FBBF24">(latency + availability monitor)</text>
    </g>
  </g>

</svg>
